# ============================================================
# IGSU Anti-Spam Mail Stack
# ============================================================
#
# Ports exposed on localhost:
#   443   → mail.igsu.local  (Roundcube HTTPS via nginx-mail)
#   8443  → admin.igsu.local (Angular admin UI HTTPS)
#   25    → Postfix SMTP
#   587   → Postfix submission (STARTTLS + SASL)
#   143   → Dovecot IMAP
#   993   → Dovecot IMAPS
#   11434 → Ollama
#
# DNS setup (hosts file):    run  scripts\setup-dns.bat       (as Admin)
# Install CA into Windows:  run  scripts\install-ca-windows.bat (as Admin, also runs DNS setup)
# ============================================================

services:

  # ---- Certificate generator (runs once) ----
  cert-init:
    build:
      context: ./deployment/certs
      dockerfile: Dockerfile
    container_name: cert-init
    volumes:
      - certs_data:/certs
    restart: "no"

  # ---- MariaDB (mail users + Roundcube DB) ----
  mariadb:
    image: mariadb:11
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE:      mailserver
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./deployment/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - mailnet

  # ---- LLM Inference ----
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - mailnet

  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    # Trage toate modelele folosite la comparație (cmd/llmcompare).
    # OLLAMA_MODELS poate fi suprascris în .env pentru altă listă (separator spațiu).
    entrypoint: ["sh", "-c", "for m in ${OLLAMA_MODELS:-qwen2.5:7b llama3.1:8b mistral:7b}; do echo \"Pulling $$m\"; ollama pull $$m; done"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"
    networks:
      - mailnet

  # ---- Mail Scanning ----
  spamassassin:
    build:
      context: ./deployment/spamassassin
      dockerfile: Dockerfile
    container_name: spamassassin
    ports:
      - "783:783"
    healthcheck:
      test: ["CMD", "spamc", "-K"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - mailnet

  clamav:
    image: clamav/clamav:latest
    container_name: clamav
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - mailnet

  # ---- Mail Storage (Dovecot — SQL auth) ----
  dovecot:
    build:
      context: ./deployment/dovecot
      dockerfile: Dockerfile
    container_name: dovecot
    ports:
      - "143:143"
      - "993:993"
    volumes:
      - mail_data:/var/mail
      - certs_data:/certs:ro
    depends_on:
      cert-init:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mailnet

  # ---- Mail Relay (Postfix — SASL via Dovecot) ----
  postfix:
    build:
      context: ./deployment/postfix
      dockerfile: Dockerfile
    container_name: postfix
    ports:
      - "25:25"
      - "587:587"
    volumes:
      - postfix_spool:/var/spool/postfix
      - dkim_keys:/etc/opendkim/keys
      - certs_data:/certs:ro
    depends_on:
      cert-init:
        condition: service_completed_successfully
      spamassassin:
        condition: service_healthy
      dovecot:
        condition: service_started
      content-filter:
        condition: service_started
    restart: unless-stopped
    networks:
      - mailnet

  # ---- Roundcube HTTPS proxy ----
  nginx-mail:
    image: nginx:1.27-alpine
    container_name: nginx-mail
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deployment/nginx-mail/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certs_data:/certs:ro
    depends_on:
      cert-init:
        condition: service_completed_successfully
      roundcube:
        condition: service_started
    restart: unless-stopped
    networks:
      - mailnet

  # ---- Webmail (Roundcube) ----
  roundcube:
    image: roundcube/roundcubemail:latest
    container_name: roundcube
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST:       dovecot
      ROUNDCUBEMAIL_DEFAULT_PORT:       "143"
      ROUNDCUBEMAIL_SMTP_SERVER:        postfix
      ROUNDCUBEMAIL_SMTP_PORT:          "587"
      ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: 20M
      # MariaDB backend for Roundcube session / contacts / prefs
      ROUNDCUBEMAIL_DB_TYPE:     mysql
      ROUNDCUBEMAIL_DB_HOST:     mariadb
      ROUNDCUBEMAIL_DB_PORT:     "3306"
      ROUNDCUBEMAIL_DB_USER:     roundcube
      ROUNDCUBEMAIL_DB_PASSWORD: roundcubepass
      ROUNDCUBEMAIL_DB_NAME:     roundcubemail
    volumes:
      - ./deployment/roundcube/config.inc.php:/var/www/html/config/config.inc.php:ro
    depends_on:
      mariadb:
        condition: service_healthy
      dovecot:
        condition: service_started
      postfix:
        condition: service_started
    restart: unless-stopped
    networks:
      - mailnet

  # ---- Anti-Spam Policy Service (envelope checks) ----
  antispam-policy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antispam-policy
    entrypoint: ["policyservice"]
    command: []
    ports:
      - "9998:9998"
    environment:
      OPENAI_API_KEY:     ollama
      OPENAI_BASE_URL:    http://ollama:11434/v1
      OPENAI_MODEL:       qwen2.5:7b
      SPAMASSASSIN_HOST:  spamassassin
      SPAMASSASSIN_PORT:  "783"
      CLAMAV_HOST:        clamav
      CLAMAV_PORT:        "3310"
      POLICY_LISTEN:      0.0.0.0:9998
    depends_on:
      - ollama
      - spamassassin
      - clamav
    restart: unless-stopped
    networks:
      - mailnet

  # ---- Anti-Spam Content Filter (full scoring pipeline) ----
  content-filter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: content-filter
    entrypoint: ["contentfilter"]
    command: []
    environment:
      OPENAI_API_KEY:     ollama
      OPENAI_BASE_URL:    http://ollama:11434/v1
      OPENAI_MODEL:       qwen2.5:7b
      SPAMASSASSIN_HOST:  spamassassin
      SPAMASSASSIN_PORT:  "783"
      CLAMAV_HOST:        clamav
      CLAMAV_PORT:        "3310"
      FILTER_LISTEN:      0.0.0.0:10024
      REINJECT_HOST:      postfix
      REINJECT_PORT:      "10025"
      DB_DSN:             "antispam:antispampass@tcp(mariadb:3306)/mailserver?parseTime=true"
    depends_on:
      mariadb:
        condition: service_healthy
      ollama:
        condition: service_healthy
      spamassassin:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mailnet

  # ---- Account Admin API (Go) ----
  account-admin:
    build:
      context: ./deployment/account-admin
      dockerfile: Dockerfile
    container_name: account-admin
    environment:
      DB_DSN:     "accountadmin:accountadminpass@tcp(mariadb:3306)/mailserver?parseTime=true"
      ADMIN_USER: admin
      ADMIN_PASS: "${ADMIN_PASS:-changeme}"
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mailnet

  # ---- Account Admin UI (Angular + nginx HTTPS) ----
  account-admin-ui:
    build:
      context: ./deployment/account-admin-ui
      dockerfile: Dockerfile
    container_name: account-admin-ui
    ports:
      - "8443:443"
      - "8080:80"
    volumes:
      - certs_data:/certs:ro
    depends_on:
      cert-init:
        condition: service_completed_successfully
      account-admin:
        condition: service_started
    restart: unless-stopped
    networks:
      - mailnet

  # ---- Anti-Spam Batch Processor (benchmarking only) ----
  antispam:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antispam
    environment:
      OPENAI_API_KEY:    ollama
      OPENAI_BASE_URL:   http://ollama:11434/v1
      OPENAI_MODEL:      qwen2.5:7b
      SPAMASSASSIN_HOST: spamassassin
      SPAMASSASSIN_PORT: "783"
      CLAMAV_HOST:       clamav
      CLAMAV_PORT:       "3310"
      SAMPLE_DIR:        /data/samples
      CLEAN_DIR:         /data/clean
      SPAM_DIR:          /data/spam
      QUARANTINE_DIR:    /data/quarantine
    volumes:
      - ./samples:/data/samples
      - ./testdata:/data/testdata
    depends_on:
      - ollama
      - spamassassin
      - clamav
    profiles:
      - batch
    networks:
      - mailnet

# ============================================================
volumes:
  certs_data:   { driver: local }
  mariadb_data: { driver: local }
  ollama_data:  { driver: local }
  clamav_data:  { driver: local }
  mail_data:    { driver: local }
  postfix_spool: { driver: local }
  dkim_keys:    { driver: local }

networks:
  mailnet:
    driver: bridge
