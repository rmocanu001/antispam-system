# Dovecot configuration for anti-spam test infrastructure

protocols = imap lmtp

# Logging
log_path = /dev/stderr
info_log_path = /dev/stderr

# Listen on all interfaces
listen = *

# Mail location - Maildir format
mail_location = maildir:/var/mail/%u/Maildir

# Authentication
auth_mechanisms = plain login

passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT /etc/dovecot/users
}

userdb {
  driver = passwd-file
  args = /etc/dovecot/users
  default_fields = uid=vmail gid=vmail home=/var/mail/%u
}

# SSL (disabled for test environment)
ssl = no

# LMTP service (Postfix delivers here)
service lmtp {
  inet_listener lmtp {
    address = 0.0.0.0
    port = 24
  }
}

# IMAP service
service imap-login {
  inet_listener imap {
    address = 0.0.0.0
    port = 143
  }
}

# Auth service (for Postfix SASL)
service auth {
  inet_listener {
    port = 12345
  }
}

# Namespace
namespace inbox {
  inbox = yes
  separator = /

  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
}

# LMTP settings
protocol lmtp {
  mail_plugins = $mail_plugins
  postmaster_address = postmaster@igsu.local
}

# Allow plaintext auth (test only)
disable_plaintext_auth = no
