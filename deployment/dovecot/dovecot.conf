protocols = imap lmtp

log_path      = /dev/stderr
info_log_path = /dev/stderr

listen = *

# Mail storage — Maildir per user
mail_location = maildir:/var/mail/%u/Maildir

# ---- TLS ----
ssl          = yes
ssl_cert     = </certs/server.crt
ssl_key      = </certs/server.key
ssl_ca       = </certs/ca.crt
ssl_min_protocol = TLSv1.2

# ---- Authentication ----
auth_mechanisms = plain login

passdb {
  driver = sql
  args   = /etc/dovecot/dovecot-sql.conf.ext
}

userdb {
  driver = sql
  args   = /etc/dovecot/dovecot-sql.conf.ext
}

# ---- Services ----

service imap-login {
  inet_listener imap {
    address = 0.0.0.0
    port    = 143
  }
  inet_listener imaps {
    address = 0.0.0.0
    port    = 993
    ssl     = yes
  }
}

# LMTP — Postfix delivers here
service lmtp {
  inet_listener lmtp {
    address = 0.0.0.0
    port    = 24
  }
}

# Auth socket for Postfix SASL (TCP, accessible inside Docker network)
service auth {
  inet_listener {
    address = 0.0.0.0
    port    = 12345
  }
}

service auth-worker {
  user = $default_internal_user
}

# ---- Namespaces ----
namespace inbox {
  inbox = yes
  separator = /

  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
}

protocol lmtp {
  mail_plugins        = $mail_plugins
  postmaster_address  = postmaster@igsu.local
}

# Allow plaintext only over TLS; plain on 143 is still accepted
# within the Docker network (no external exposure risk).
disable_plaintext_auth = no
