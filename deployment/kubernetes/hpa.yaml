apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: postfix-hpa
  namespace: antispam-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: postfix
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: antispam-policy-hpa
  namespace: antispam-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: antispam-policy
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
