apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
  namespace: antispam-system
  labels:
    app: ollama
spec:
  serviceName: ollama-svc
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
              name: http
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
          resources:
            requests:
              memory: "8Gi"
              cpu: "2"
            limits:
              memory: "16Gi"
              cpu: "8"
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 60
            periodSeconds: 30
      # Init container to pull the model
      initContainers:
        - name: model-pull
          image: ollama/ollama:latest
          command: ["sh", "-c"]
          args:
            - |
              until curl -s http://localhost:11434/api/tags > /dev/null 2>&1; do
                echo "Waiting for Ollama to start..."
                sleep 2
              done
              ollama pull qwen2.5:7b
          env:
            - name: OLLAMA_HOST
              value: "http://localhost:11434"
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
      volumes:
        - name: ollama-models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-svc
  namespace: antispam-system
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
      name: http
  type: ClusterIP
